<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Luke's Cookies</title>
    <link rel="icon" type="image/png" href="/assets/SmallLogo.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="auth" class="auth-screen">
      <img class="banner" src="/assets/BannerLogo.png" alt="Luke's Cookies" />
      <div class="auth-card">
        <div class="tabs">
          <button id="tab-login" class="tab active" type="button">Log in</button>
          <button id="tab-register" class="tab" type="button">Create account</button>
        </div>
        <form id="auth-form">
          <label>
            Username
            <input id="auth-username" name="username" autocomplete="username" maxlength="24" required />
          </label>
          <label>
            Password
            <input id="auth-password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <p id="auth-error" class="error" hidden></p>
          <button id="auth-submit" class="btn primary" type="submit">Log in</button>
        </form>
        <p class="hint">No email. Just a username and password stored on the server.</p>
      </div>
    </div>

    <div id="app" class="app" hidden>
      <aside class="sidebar">
        <header class="sidebar-top">
          <img class="small-logo" src="/assets/SmallLogo.png" alt="" />
          <div class="brand">
            <strong>Luke's Cookies</strong>
            <span id="me-name"></span>
          </div>
        </header>
        <div id="wipe-banner" class="wipe-banner">Unpinned messages wipe monthly. Pin one to keep it.</div>
        <div class="search-wrap">
          <input id="user-search" placeholder="Find someone by username" />
          <div id="search-results" class="search-results" hidden></div>
        </div>
        <div id="conversation-list" class="conversation-list"></div>
        <footer class="sidebar-footer">
          <button id="btn-username" class="btn ghost" type="button">Change username</button>
          <button id="btn-logout" class="btn ghost" type="button">Log out</button>
        </footer>
      </aside>

      <main class="chat">
        <div id="empty-chat" class="empty-chat">
          <img src="/assets/SmallLogo.png" alt="" />
          <p>Pick a chat or find someone to message.</p>
        </div>
        <section id="thread" class="thread" hidden>
          <header class="thread-top">
            <button id="back-btn" class="back-btn" type="button" aria-label="Back">‹</button>
            <h1 id="thread-name"></h1>
          </header>
          <div id="messages" class="messages"></div>
          <div id="file-preview" class="file-preview" hidden></div>
          <p id="compose-error" class="error compose-error" hidden></p>
          <form id="compose" class="compose">
            <label class="attach-btn" title="Attach files">
              +
              <input id="file-input" type="file" multiple />
            </label>
            <input id="compose-input" placeholder="Message" maxlength="2000" autocomplete="off" />
            <button class="btn primary" type="submit">Send</button>
          </form>
        </section>
      </main>
    </div>

    <dialog id="username-dialog">
      <form id="username-form" method="dialog">
        <h2>Change username</h2>
        <p>Your chats stay put. Only the name people see will change.</p>
        <input id="new-username" maxlength="24" required />
        <p id="username-error" class="error" hidden></p>
        <div class="dialog-actions">
          <button class="btn ghost" value="cancel" type="submit">Cancel</button>
          <button id="username-save" class="btn primary" type="button">Save</button>
        </div>
      </form>
    </dialog>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
